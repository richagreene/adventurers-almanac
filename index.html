<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Adventurer's Almanac · OSRS</title>
    <meta name="description" content="A live Old School RuneScape planner — money-making, skilling, quests, bossing and more, wired to live Grand Exchange prices and your hiscores." />

    <meta name="theme-color" content="#1c130c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Almanac" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
      body {
        background: #1c130c;
        font-family: 'EB Garamond', Georgia, serif;
        color: #2c2013;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-track { background: #2a1a10; }
      ::-webkit-scrollbar-thumb { background: #6b5226; border: 2px solid #2a1a10; border-radius: 6px; }
      ::-webkit-scrollbar-thumb:hover { background: #8a6a32; }
      @keyframes sealpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(201,162,74,0);} 50% { box-shadow: 0 0 18px 2px rgba(201,162,74,.35);} }
      input.led, select.led {
        font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2c2013;
        background: #fbf6e8; border: 1px solid rgba(44,32,19,.3); border-radius: 4px;
        padding: 7px 9px; outline: none;
      }
      input.led:focus, select.led:focus { border-color: #b98f3e; box-shadow: 0 0 0 2px rgba(201,162,74,.25); }
      input.led::placeholder { color: #a89067; }
      a { color: inherit; }
      /* Spreadsheet-adjacent data tables: zebra rows, faint cell gridlines, tabular figures. */
      table.sheet { border-collapse: collapse; width: 100%; }
      table.sheet th { background: #2a1a10; color: #bfa676; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; text-align: left; padding: 7px 10px; border: 1px solid rgba(44,32,19,.22); position: sticky; top: 0; }
      table.sheet td { padding: 6px 10px; border: 1px solid rgba(44,32,19,.10); font-variant-numeric: tabular-nums; }
      table.sheet tbody tr:nth-child(odd) { background: rgba(255,250,235,.5); }
      table.sheet tbody tr:nth-child(even) { background: rgba(236,225,198,.45); }
      table.sheet tbody tr:hover { background: rgba(201,162,74,.16); }
      table.sheet td.num, table.sheet th.num { text-align: right; }
      .sheetwrap { border: 1px solid rgba(44,32,19,.22); border-radius: 6px; overflow: auto; box-shadow: inset 0 0 0 1px rgba(255,250,235,.4); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
